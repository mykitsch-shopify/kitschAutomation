name: web-matrix

# PRs run mobile only — 80% of traffic, and it keeps the signal fast enough
# that people wait for it. The full browser matrix and real devices run
# nightly, off-peak for US business hours.
on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1-5' # 02:00 PT / 04:00 CT — outside client hours
  workflow_dispatch:

concurrency:
  group: web-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # `${{ vars.NAME }}` for a repository variable that does not exist resolves to
  # an EMPTY STRING, not to nothing. On 2026-09-04 that produced 1,032 failures,
  # every one "Cannot navigate to invalid URL", and — because an empty string is
  # not the fixture URL — playwright.config.ts believed it was pointed at a real
  # store. The config now refuses an empty value outright; the `target` job below
  # says so once, before six matrix jobs spend twenty minutes discovering it.
  KITSCH_BASE_URL: ${{ vars.KITSCH_DEV_STORE_URL }}

jobs:
  target:
    # Fails in seconds, with the fix, rather than in six parallel jobs.
    runs-on: ubuntu-latest
    steps:
      - name: A target was actually supplied
        run: |
          if [ -z "${KITSCH_BASE_URL}" ]; then
            echo "::error::KITSCH_BASE_URL is empty. The repository variable" \
                 "KITSCH_DEV_STORE_URL is not set, so \${{ vars.KITSCH_DEV_STORE_URL }}" \
                 "resolved to an empty string. Set it under Settings > Secrets and" \
                 "variables > Actions > Variables, or change this workflow to run" \
                 "against the fixture on purpose by not setting KITSCH_BASE_URL at all."
            exit 1
          fi
          echo "target: ${KITSCH_BASE_URL}"

  pr-mobile:
    needs: target
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: >-
          npx playwright test
          --project=mobile-safari --project=mobile-chrome
          --grep @smoke
          --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: blob-pr-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  nightly-full:
    needs: target
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-safari, mobile-chrome, desktop-chrome, desktop-safari, desktop-firefox, desktop-edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 14

  # Emulated WebKit is not iOS Safari. This job is the only thing that may be
  # reported as real-device coverage.
  real-devices:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --config=playwright.grid.config.ts --grep @smoke
        env:
          GRID_WS_ENDPOINT: ${{ secrets.DEVICE_GRID_WS_ENDPOINT }}

  report:
    needs: [pr-mobile, nightly-full]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: blob-*, path: all-blobs, merge-multiple: true }
      - run: npx playwright merge-reports --reporter=html,github ./all-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
